name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check tag matches versionName
        run: |
          VERSION=$(grep -E '^versionName' tool/lighttool.toml | cut -d'"' -f2)
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match versionName $VERSION in tool/lighttool.toml"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew :tool:assembleRelease --stacktrace

      - name: Rename APK
        run: mv tool/build/outputs/apk/release/tool-release.apk "PodcastsPlus-$GITHUB_REF_NAME.apk"

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Podcasts+ ${{ github.ref_name }}
          files: PodcastsPlus-${{ github.ref_name }}.apk
          generate_release_notes: true
